services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_demo
      POSTGRES_USER: agent_reader
      POSTGRES_PASSWORD: agent_reader_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_reader -d agent_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: python scripts/run_api.py
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      USE_LLM: "false"
      DATABASE_URL: postgresql+pg8000://agent_reader:agent_reader_password@postgres:5432/agent_demo
      SQL_DIALECT: postgres
      LLM_PROVIDER: zhipu
      LLM_MODEL: glm-5-turbo
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}

  ui:
    build: .
    command: python scripts/run_ui.py
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      USE_LLM: "false"
      DATABASE_URL: postgresql+pg8000://agent_reader:agent_reader_password@postgres:5432/agent_demo
      SQL_DIALECT: postgres
      LLM_PROVIDER: zhipu
      LLM_MODEL: glm-5-turbo
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
